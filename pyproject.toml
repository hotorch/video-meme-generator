[project]
name = "memegen"
version = "0.2.0"
description = "Reference video + your characters -> meme video with Higgsfield Genjutsu, driven by Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hotorch" }]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.6",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "yt-dlp>=2024.1.0",
  "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memegen = "memegen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
